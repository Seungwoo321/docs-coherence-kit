<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="docs-coherence-kit">
  <title>docs-coherence-kit</title>
  <style>
    svg { --ink: #0f172a; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e2e8f0; --accent: #a5b4fc; }
    }
  </style>

  <!-- 문서 세 장. 가운데가 그 사실의 정본이라 혼자 길다. -->
  <g fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
    <rect x="4" y="15" width="16" height="34" rx="3.5" />
    <rect x="24" y="9" width="16" height="46" rx="3.5" />
    <rect x="44" y="15" width="16" height="34" rx="3.5" />
  </g>

  <!-- 문서를 가로질러 같은 사실을 잇는 실. 검사는 이 선 위에서 일어난다. -->
  <path d="M12,32 L52,32" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
  <circle cx="12" cy="32" r="3.6" fill="var(--accent)" />
  <circle cx="52" cy="32" r="3.6" fill="var(--accent)" />
  <circle cx="32" cy="32" r="5.4" fill="var(--accent)" />
</svg>
